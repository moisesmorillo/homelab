---
name: Validate repository

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: YAML, Ansible and Kustomize
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint YAML
        run: yamllint .

      - name: Enforce the public template boundary
        run: make public-boundary

      - name: Reject plaintext Kubernetes Secrets
        run: make secrets PYTHON=python

      - name: Lint Ansible
        working-directory: ansible
        run: ansible-lint playbooks roles inventory

      - name: Check Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/network-stage.yaml

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.2
        with:
          go-version: 1.23.10
          cache: false

      - name: Render Kubernetes configuration
        run: make kustomize
